name: Check skill
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-linux-vm101:
    name: Check skill (VM101 Linux)
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, vm101, podman]
    concurrency:
      group: vm101-server-ops-skills-check
      cancel-in-progress: false
    timeout-minutes: 15
    env:
      RUNNER_TOOL_CACHE: /home/runner/work/_tool
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm test
      - run: npm run smoke

  check-linux-hosted:
    name: Check skill (Hosted Linux PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm test
      - run: npm run smoke

  check-windows:
    name: Check skill (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm test
      - run: npm run smoke
